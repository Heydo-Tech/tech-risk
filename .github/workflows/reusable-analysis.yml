name: Reusable Repo Analysis

on:
  workflow_call:
    inputs:
      tools:
        description: 'Comma-separated list of tools to run'
        required: false
        type: string
        default: 'ruff,bandit,semgrep,pip-audit,mypy,pytest,import-linter,snyk,dep-scan,dependency-cruiser,sonarqube,react-doctor,apnimandi-design'

      enable_codex:
        description: 'Enable OpenAI Codex Security and Codex Architecture scanners'
        required: false
        type: boolean
        default: true

      enable_design_ai:
        description: 'Enable AI Semantic Design Checks'
        required: false
        type: boolean
        default: true

      enable_deslint:
        description: 'Enable Deslint React UI Consistency analysis'
        required: false
        type: boolean
        default: true

      orchestrator_ref:
        description: 'Branch or tag of the orchestrator repository to use'
        required: false
        type: string
        default: 'main'

      run_id:
        description: 'Internal analysis run ID'
        required: false
        type: string
        default: ''

    secrets:
      GEMINI_API_KEY:
        description: 'Gemini API Key'
        required: false

      OPENAI_API_KEY:
        description: 'OpenAI API Key for Codex scanners'
        required: false

      SNYK_TOKEN:
        description: 'Snyk API Token'
        required: false

      DATABASE_URL:
        description: 'PostgreSQL Database Connection URL'
        required: false

      ANALYSIS_BACKEND_URL:
        description: 'Backend API base URL for report callback'
        required: false

      ANALYSIS_SECRET:
        description: 'Shared secret for backend report callback'
        required: false

jobs:
  analyze:
    name: Run Repository Analysis
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # Checkout target repository
      # =========================================================

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target-repo

      # =========================================================
      # Checkout central orchestrator
      # =========================================================

      - name: Checkout orchestrator repository
        uses: actions/checkout@v4
        with:
          repository: Heydo-Tech/tech-risk
          ref: ${{ inputs.orchestrator_ref }}
          path: orchestrator-repo

      # =========================================================
      # Runtime setup
      # =========================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: orchestrator-repo/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # =========================================================
      # Install analysis dependencies
      # =========================================================

      - name: Install orchestrator and CLI dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            ruff bandit semgrep pip-audit mypy pytest import-linter owasp-depscan \
            google-genai openai psycopg pydantic requests pyyaml

          sudo apt-get update && sudo apt-get install -y cloc || true

          npm install -g \
            snyk \
            @cyclonedx/cdxgen \
            dependency-cruiser \
            react-doctor

      # =========================================================
      # Execute Analysis
      # =========================================================

      - name: Run Orchestrator Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANALYSIS_RUN_ID: ${{ inputs.run_id }}

          AI_PROVIDER: gemini
          GEMINI_MODEL: gemini-3.5-flash
          AI_BATCH_SIZE: '5'
          AI_MAX_OUTPUT_TOKENS: '4000'

          ENABLE_DESIGN_AI: ${{ inputs.enable_design_ai }}
          ENABLE_DESLINT: ${{ inputs.enable_deslint }}

        run: |
          cd target-repo
          rm -f report.json report.csv

          TOOLS="${{ inputs.tools }}"

          if [ "${{ inputs.enable_codex }}" = "true" ]; then
            TOOLS="$TOOLS,codex-security,codex-architecture"
          fi

          if [ "${{ inputs.enable_deslint }}" = "true" ] && [[ ",$TOOLS," != *",deslint,"* ]]; then
            TOOLS="$TOOLS,deslint"
          fi

          EXTRA_ARGS=""
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --persist"
          fi

          python ../orchestrator-repo/analyze_repo.py \
            . \
            --repo-name "${{ github.repository }}" \
            --tools "$TOOLS" \
            --output json,csv \
            --run-ai \
            $EXTRA_ARGS

      # =========================================================
      # Callback completed report to backend
      # =========================================================

      - name: Send completed report to backend
        env:
          ANALYSIS_BACKEND_URL: ${{ secrets.ANALYSIS_BACKEND_URL }}
          ANALYSIS_SECRET: ${{ secrets.ANALYSIS_SECRET }}
          ANALYSIS_RUN_ID: ${{ inputs.run_id }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          cd target-repo

          if [ -z "$ANALYSIS_BACKEND_URL" ]; then
            echo "[analysis-callback] ANALYSIS_BACKEND_URL is not configured; skipping callback."
            exit 0
          fi

          if [ -z "$ANALYSIS_SECRET" ]; then
            echo "[analysis-callback] ANALYSIS_SECRET is not configured; skipping callback."
            exit 0
          fi

          if [ -z "$ANALYSIS_RUN_ID" ]; then
            echo "[analysis-callback] run_id input is empty; skipping callback."
            exit 0
          fi

          if [ ! -s report.json ]; then
            echo "[analysis-callback] report.json was not generated; skipping callback."
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          backend_url = os.environ["ANALYSIS_BACKEND_URL"].rstrip("/")
          run_id = os.environ["ANALYSIS_RUN_ID"]
          callback_url = f"{backend_url}/api/analysis/runs/{run_id}/report"

          with open("report.json", "r", encoding="utf-8") as report_file:
              report = json.load(report_file)

          payload = {
              "repository": os.environ.get("REPOSITORY"),
              "branch": os.environ.get("BRANCH"),
              "commit_sha": os.environ.get("COMMIT_SHA"),
              "workflow_run_id": os.environ.get("WORKFLOW_RUN_ID"),
              "status": "COMPLETED",
              "report": report,
          }

          request = urllib.request.Request(
              callback_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['ANALYSIS_SECRET']}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read().decode("utf-8", errors="replace")
                  print(f"[analysis-callback] backend accepted report for run_id={run_id} status={response.status}")
                  if body:
                      print(f"[analysis-callback] response: {body[:1000]}")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              print(f"[analysis-callback] backend rejected report for run_id={run_id} status={exc.code}: {body[:1000]}")
              sys.exit(0)
          except Exception as exc:
              print(f"[analysis-callback] callback unavailable for run_id={run_id}: {exc}")
              sys.exit(0)
          PY

      # =========================================================
      # Upload reports
      # =========================================================

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-analysis-report-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ github.run_id }}
          path: |
            target-repo/report.json
            target-repo/report.csv
          if-no-files-found: warn
          retention-days: 30
